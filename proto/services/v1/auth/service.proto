syntax = "proto3";
package services.v1.auth;
option go_package = "github.com/scrynaxx/tr-core/generated/services/v1/auth;v1auth";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "buf/validate/validate.proto";

service AuthService {
  rpc SignIn(SignInRequest) returns (AuthResponse) {
    option (google.api.http) = {
      post: "/v1/auth/sign-in",
      body: "*"
    };
  }

  rpc SignOut(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/v1/auth/sign-out"
    };
  }

  rpc Refresh(google.protobuf.Empty) returns (AuthResponse) {
    option (google.api.http) = {
      post: "/v1/auth/refresh"
    };
  }
}

message SignInRequest {
  string email = 1 [(buf.validate.field).string = {email: true}];
  string password = 2 [(buf.validate.field).string = {min_len: 1, max_len: 255}];
}

message AuthResponse {
  string token = 1;
  int64 expires_in = 2;
}